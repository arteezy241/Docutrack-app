name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-check:
    name: Expo Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Expo package compatibility
        run: npx expo install --check || true
